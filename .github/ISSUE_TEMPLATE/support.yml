name: Help or bug report / Yardım veya hata bildirimi
description: Ask a question or report a problem with Klar. / Klar ile ilgili soru sor veya sorun bildir.
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Do not share personal information, email addresses or audio recordings you do not want others to see.
        **Bu talep herkese açıktır.** Başkalarının görmesini istemediğin kişisel bilgi, e-posta adresi veya ses kaydı paylaşma.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Ne oldu?
      description: What did you expect, and what happened instead? / Ne bekliyordun, ne oldu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Tekrar oluşturma adımları
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: input
    id: klar
    attributes:
      label: Klar version / Klar sürümü
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version / macOS sürümü
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Microphone, headphones and call app / Mikrofon, kulaklık ve arama uygulaması
      placeholder: "AirPods Pro, Zoom, BlackHole 2ch"
